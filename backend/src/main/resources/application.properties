spring.application.name=backend

# Database Connectivity
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
spring.datasource.username=${DB_USERNAME:knowledge}
spring.datasource.password=${DB_PASSWORD:knowledge}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl.auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI OpenAI Settings (FIXED NAMESPACES)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small
